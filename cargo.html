<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta por Cargo</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #1f2937;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .topo {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      padding: 22px 18px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 16px;
    }

    .topo h1 {
      margin: 0;
      font-size: 24px;
    }

    .topo p {
      margin: 8px 0 0;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 15px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-voltar {
      background: #e5e7eb;
      color: #111827;
    }

    .resultado {
      display: grid;
      gap: 10px;
    }

    .item {
      background: white;
      border-radius: 16px;
      padding: 14px;
      border: 1px solid #dbeafe;
    }

    .nome {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .cargo {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .info {
      font-size: 14px;
      margin: 4px 0;
    }

    .msg {
      text-align: center;
      color: #6b7280;
      margin-top: 10px;
      font-size: 14px;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 340px;
      border-radius: 18px;
      padding: 22px 18px;
      text-align: center;
    }

    .modal h3 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #1d4ed8;
    }

    .pix {
      font-size: 22px;
      font-weight: bold;
      color: #15803d;
      margin: 14px 0;
    }

    .botoes-modal {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-secundario {
      background: #ecfdf5;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <h3>Apoie este projeto</h3>
      <p>Se este trabalho te ajudou, contribua via PIX:</p>
      <div class="pix" id="pixChave">31 99617-4800</div>

      <div class="botoes-modal">
        <button class="btn-secundario" onclick="copiarPix()">Copiar chave PIX</button>
        <button onclick="fecharModal()">Entrar</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="topo">
      <h1 id="tituloCargo">Consulta por Cargo</h1>
      <p>PSS 02 2025 - Nível Médio</p>
    </div>

    <div class="card">
      <input type="text" id="nome" placeholder="Coloque seu nome aqui" />
      <button onclick="buscar()">Pesquisar</button>
      <button class="btn-voltar" onclick="window.location.href='index.html'">Voltar para cargos</button>
      <div id="msg" class="msg"></div>
    </div>

    <div id="resultado" class="resultado"></div>
  </div>

  <script>
    const arquivo = "classificacao_pss_medio_refinado.xlsx";
    const chavePix = "31 99617-4800";
    let dados = [];
    let cargoSelecionado = "";

    function fecharModal() {
      document.getElementById("modal").style.display = "none";
    }

    function abrirModal() {
      document.getElementById("modal").style.display = "flex";
    }

    async function copiarPix() {
      try {
        await navigator.clipboard.writeText(chavePix);
        alert("Chave PIX copiada: " + chavePix);
      } catch (e) {
        alert("Não foi possível copiar automaticamente. Chave PIX: " + chavePix);
      }
    }

    function normalizar(texto) {
      return (texto || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function getClassificacao(item) {
      return item.Classificacao ??
             item["Classificação"] ??
             item["Classificação Geral"] ?? "";
    }

    function getCotaNegro(item) {
      return item["RESERVA DE VAGAS AUTODECLARADOS PRETOS OU PARDOS"] ??
             item["Classificação Cota Negro"] ??
             item["Cota Negro"] ?? "";
    }

    function getPcD(item) {
      return item["RESERVA DE VAGAS PESSOA COM DEFICIÊNCIA"] ??
             item["PcD"] ?? "";
    }

    function buscar() {
      abrirModal();

      const nome = normalizar(document.getElementById("nome").value);
      const resultadoDiv = document.getElementById("resultado");
      const msg = document.getElementById("msg");

      resultadoDiv.innerHTML = "";
      msg.innerHTML = "";

      let resultado = dados.filter(item => item.Cargo === cargoSelecionado);

      if (nome) {
        resultado = resultado.filter(item => normalizar(item.Nome).includes(nome));
      }

      if (!resultado.length) {
        msg.innerHTML = "Nenhum resultado encontrado.";
        return;
      }

      resultado.forEach(p => {
        resultadoDiv.innerHTML += `
          <div class="item">
            <div class="nome">${p.Nome || ""}</div>
            <div class="cargo">${p.Cargo || ""}</div>
            <div class="info"><strong>Classificação:</strong> ${getClassificacao(p)}</div>
            <div class="info"><strong>Cota negro:</strong> ${getCotaNegro(p)}</div>
            <div class="info"><strong>PcD:</strong> ${getPcD(p)}</div>
          </div>
        `;
      });
    }

    const params = new URLSearchParams(window.location.search);
    cargoSelecionado = params.get("cargo") || "";

    document.getElementById("tituloCargo").textContent = cargoSelecionado || "Consulta por Cargo";

    fetch(arquivo)
      .then(resp => {
        if (!resp.ok) throw new Error("Arquivo não encontrado");
        return resp.arrayBuffer();
      })
      .then(arrayBuffer => {
        const workbook = XLSX.read(arrayBuffer, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        dados = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        buscar();
      })
      .catch(() => {
        document.getElementById("msg").innerHTML =
          "Erro ao carregar o arquivo Excel.";
      });
  </script>
</body>
</html>
