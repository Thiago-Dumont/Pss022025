<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classificação PSS 02 2025</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2f7;
  color: #222;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 16px;
}

/* TOPO */
.topo {
  background: linear-gradient(135deg, #2563eb, #3b82f6);
  color: white;
  padding: 20px;
  border-radius: 18px;
  text-align: center;
  margin-bottom: 16px;
}

.topo h1 {
  margin: 0;
  font-size: 22px;
}

.topo p {
  margin: 6px 0 0;
  font-size: 13px;
  opacity: 0.9;
}

/* FILTROS */
.filtros {
  background: white;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

input, select, button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 14px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

/* RESULTADOS */
.resultado {
  background: white;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.resultado strong {
  color: #2563eb;
}

/* AVISO PIX */
.aviso-pix {
  margin: 28px 0 10px;
  padding: 12px 14px;
  font-size: 12px;
  color: #666;
  text-align: center;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="topo">
    <h1>Classificação PSS 02 2025</h1>
    <p>Consulte sua colocação por nome ou cargo</p>
  </div>

  <div class="filtros">
    <input type="text" id="nome" placeholder="Digite seu nome aqui">
    
    <select id="cargo">
      <option value="">Todos os cargos</option>
    </select>

    <button onclick="buscar()">Pesquisar</button>
  </div>

  <div id="resultados"></div>

  <div class="aviso-pix">
    Caso este conteúdo tenha te ajudado, você pode apoiar via PIX: <strong>31 99617-4800</strong>
  </div>

</div>

<script>
let dados = [];

/* CARREGAR EXCEL */
fetch('classificacao_pss_medio_refinado.xlsx')
  .then(res => res.arrayBuffer())
  .then(data => {
    const workbook = XLSX.read(data);
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    dados = XLSX.utils.sheet_to_json(sheet);

    preencherCargos();
  });

/* PREENCHER CARGOS */
function preencherCargos() {
  const select = document.getElementById('cargo');
  const cargos = [...new Set(dados.map(d => d.CARGO))];

  cargos.sort().forEach(c => {
    let option = document.createElement('option');
    option.value = c;
    option.textContent = c;
    select.appendChild(option);
  });
}

/* BUSCA */
function buscar() {
  const nome = document.getElementById('nome').value.toLowerCase();
  const cargo = document.getElementById('cargo').value;

  let filtrados = dados.filter(d => {
    return (!nome || d.NOME.toLowerCase().includes(nome)) &&
           (!cargo || d.CARGO === cargo);
  });

  mostrarResultados(filtrados);
}

/* MOSTRAR RESULTADOS */
function mostrarResultados(lista) {
  const div = document.getElementById('resultados');
  div.innerHTML = '';

  if (lista.length === 0) {
    div.innerHTML = '<p>Nenhum resultado encontrado.</p>';
    return;
  }

  lista.forEach(item => {
    div.innerHTML += `
      <div class="resultado">
        <strong>${item.NOME}</strong><br>
        Cargo: ${item.CARGO}<br>
        Classificação: ${item.CLASSIFICACAO}
      </div>
    `;
  });
}
</script>

</body>
</html>
