<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificação PSS 02 2025</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    input, select, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      width: 100%;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #eef2ff;
    }

    tr:hover {
      background: #f1f5ff;
    }

    .status {
      margin-top: 10px;
      color: #555;
    }
  </style>
</head>

<body>

<header>
  Classificação PSS 02 2025
</header>

<div class="container">

  <div class="box">
    <div class="grid">
      <input type="text" id="nome" placeholder="Buscar por nome">

      <select id="cargo">
        <option value="">Todos os cargos</option>
      </select>

      <input type="number" id="min" placeholder="Classificação mínima">
      <input type="number" id="max" placeholder="Classificação máxima">
    </div>

    <br>

    <button onclick="filtrar()">Pesquisar</button>

    <p class="status">
      Total: <span id="total">0</span> |
      Filtrado: <span id="filtrado">0</span>
    </p>
  </div>

  <div class="box">
    <table>
      <thead>
        <tr>
          <th>Cargo</th>
          <th>Nome</th>
          <th>Classificação</th>
        </tr>
      </thead>
      <tbody id="tabela">
        <tr><td colspan="3">Carregando...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const arquivo = "resultado_extraido.xlsx";

let dados = [];
let dadosFiltrados = [];

async function carregar() {
  const res = await fetch(arquivo);
  const buffer = await res.arrayBuffer();

  const workbook = XLSX.read(buffer, {type: "array"});
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const json = XLSX.utils.sheet_to_json(sheet);

  dados = json.map(x => ({
    Cargo: x["Cargo"],
    Nome: x["Nome"],
    Classificação: Number(x["Classificação"])
  })).filter(x => x.Cargo && x.Nome);

  preencherCargos();
  dadosFiltrados = [...dados];

  atualizarTabela();
}

function preencherCargos() {
  const cargos = [...new Set(dados.map(x => x.Cargo))].sort();
  const select = document.getElementById("cargo");

  cargos.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });
}

function filtrar() {
  const nome = document.getElementById("nome").value.toLowerCase();
  const cargo = document.getElementById("cargo").value;
  const min = document.getElementById("min").value;
  const max = document.getElementById("max").value;

  dadosFiltrados = dados.filter(x => {
    return (!nome || x.Nome.toLowerCase().includes(nome)) &&
           (!cargo || x.Cargo === cargo) &&
           (!min || x.Classificação >= min) &&
           (!max || x.Classificação <= max);
  });

  atualizarTabela();
}

function atualizarTabela() {
  const tbody = document.getElementById("tabela");

  if (dadosFiltrados.length === 0) {
    tbody.innerHTML = "<tr><td colspan='3'>Nenhum resultado</td></tr>";
    return;
  }

  tbody.innerHTML = dadosFiltrados.map(x => `
    <tr>
      <td>${x.Cargo}</td>
      <td>${x.Nome}</td>
      <td>${x.Classificação}</td>
    </tr>
  `).join("");

  document.getElementById("total").textContent = dados.length;
  document.getElementById("filtrado").textContent = dadosFiltrados.length;
}

carregar();
</script>

</body>
</html>
