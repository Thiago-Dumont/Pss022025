<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSS 02 2025 - Nível Médio</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #1f2937;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .topo {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      padding: 22px 18px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.18);
    }

    .topo h1 {
      margin: 0;
      font-size: 25px;
    }

    .topo p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }

    .card {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 18px;
      color: #1d4ed8;
    }

    .lista-cargos {
      display: grid;
      gap: 10px;
    }

    .cargo-item {
      background: #f8fbff;
      border: 1px solid #dbeafe;
      border-radius: 14px;
      padding: 14px;
    }

    .cargo-nome {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .cargo-link {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .cargo-link:hover {
      text-decoration: underline;
    }

    .info-arquivo {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
      margin-top: 8px;
    }

    .msg {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      padding: 10px 0;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }

    .modal {
      background: #fff;
      width: 100%;
      max-width: 340px;
      border-radius: 18px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.22);
    }

    .modal h3 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #1d4ed8;
    }

    .modal p {
      margin: 0 0 10px;
      font-size: 14px;
      color: #374151;
    }

    .pix {
      font-size: 22px;
      font-weight: bold;
      color: #15803d;
      margin: 14px 0;
      word-break: break-word;
    }

    .botoes-modal {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primario {
      background: #2563eb;
      color: #fff;
    }

    .btn-secundario {
      background: #ecfdf5;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .rodape {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      margin-top: 18px;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- POPUP PIX -->
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h3>Apoie este projeto</h3>
      <p>Se este trabalho te ajudou, contribua via PIX:</p>
      <div class="pix" id="pixChave">31 99617-4800</div>

      <div class="botoes-modal">
        <button class="btn-secundario" onclick="copiarPix()">Copiar chave PIX</button>
        <button class="btn-primario" onclick="fecharModal()">Entrar</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="topo">
      <h1>Classificação PSS 02 2025</h1>
      <p>Nível Médio</p>
      <p>Selecione o cargo para abrir a próxima página</p>
    </div>

    <div class="card">
      <h2>Cargos disponíveis</h2>
      <div id="listaCargos" class="lista-cargos"></div>
      <div id="msg" class="msg">Carregando cargos...</div>
      <div class="info-arquivo">Arquivo: classificacao_pss_medio_refinado.xlsx</div>
    </div>

    <div class="rodape">
      Elaborado por Data Ápice
    </div>
  </div>

  <script>
    const arquivo = "classificacao_pss_medio_refinado.xlsx";
    const chavePix = "31 99617-4800";
    let dados = [];

    function fecharModal() {
      document.getElementById("modal").style.display = "none";
    }

    function abrirModal() {
      document.getElementById("modal").style.display = "flex";
    }

    async function copiarPix() {
      try {
        await navigator.clipboard.writeText(chavePix);
        alert("Chave PIX copiada: " + chavePix);
      } catch (e) {
        alert("Não foi possível copiar automaticamente. Chave PIX: " + chavePix);
      }
    }

    function normalizar(texto) {
      return (texto || "")
        .toString()
        .trim();
    }

    function gerarSlugCargo(cargo) {
      return normalizar(cargo)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function abrirPaginaCargo(cargo) {
      abrirModal();

      const slug = gerarSlugCargo(cargo);

      setTimeout(() => {
        window.location.href = `cargo.html?cargo=${encodeURIComponent(cargo)}&slug=${encodeURIComponent(slug)}`;
      }, 300);
    }

    function renderizarCargos() {
      const lista = document.getElementById("listaCargos");
      const msg = document.getElementById("msg");

      lista.innerHTML = "";

      const cargos = [...new Set(
        dados
          .map(item => normalizar(item.Cargo))
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "pt-BR"));

      if (!cargos.length) {
        msg.textContent = "Nenhum cargo encontrado no arquivo.";
        return;
      }

      msg.textContent = "";

      cargos.forEach(cargo => {
        const div = document.createElement("div");
        div.className = "cargo-item";

        div.innerHTML = `
          <div class="cargo-nome">${cargo}</div>
          <a href="#" class="cargo-link" data-cargo="${cargo}">Clique aqui</a>
        `;

        lista.appendChild(div);
      });

      document.querySelectorAll(".cargo-link").forEach(link => {
        link.addEventListener("click", function(e) {
          e.preventDefault();
          const cargo = this.getAttribute("data-cargo");
          abrirPaginaCargo(cargo);
        });
      });
    }

    fetch(arquivo)
      .then(resp => {
        if (!resp.ok) {
          throw new Error("Arquivo não encontrado.");
        }
        return resp.arrayBuffer();
      })
      .then(arrayBuffer => {
        const workbook = XLSX.read(arrayBuffer, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        dados = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        renderizarCargos();
      })
      .catch(() => {
        document.getElementById("msg").textContent =
          "Erro ao carregar o arquivo Excel. Verifique se o arquivo classificacao_pss_medio_refinado.xlsx está na mesma pasta do index.html.";
      });
  </script>
</body>
</html>
