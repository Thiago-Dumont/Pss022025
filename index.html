<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificação PSS 02 2025</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial;
      padding: 10px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      font-size: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 8px;
      border: 1px solid #ccc;
      font-size: 12px;
      text-align: left;
    }

    th {
      background: #007bff;
      color: white;
    }
  </style>
</head>

<body>

<h1>Classificação PSS 02 2025</h1>

<input type="text" id="filtro" placeholder="Digite o nome...">

<table id="tabela">
  <thead>
    <tr>
      <th>Cargo</th>
      <th>Nome</th>
      <th>Classificação Geral</th>
      <th>Cota Negro</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const url = "resultado_extraido_atualizado.xlsx"; // arquivo no GitHub

fetch(url)
  .then(res => res.arrayBuffer())
  .then(data => {
    const workbook = XLSX.read(data, { type: "array" });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    window.dados = json;
    renderizar(json);
  });

function renderizar(dados) {
  const tbody = document.querySelector("#tabela tbody");
  tbody.innerHTML = "";

  dados.forEach(item => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${item.Cargo || ""}</td>
      <td>${item.Nome || ""}</td>
      <td>${item.Classificacao || item["Classificação"] || ""}</td>
      <td>${item.Classificacao_Cota_Negro || ""}</td>
    `;

    tbody.appendChild(tr);
  });
}

// filtro por nome
document.getElementById("filtro").addEventListener("input", function() {
  const texto = this.value.toLowerCase();

  const filtrado = window.dados.filter(item =>
    (item.Nome || "").toLowerCase().includes(texto)
  );

  renderizar(filtrado);
});
</script>

</body>
</html>
