  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSS 02 2025</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    .topo {
      text-align: center;
      margin-bottom: 20px;
    }

    .topo h1 {
      margin: 0;
      font-size: 26px;
    }

    .topo p {
      margin: 5px 0 0;
      color: #555;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .resultado {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .card {
      background: white;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #ddd;
    }

    .nome {
      font-size: 16px;
      font-weight: bold;
    }

    .cargo {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .info {
      font-size: 14px;
      margin-top: 4px;
    }

    .destaque {
      border: 2px solid #2563eb;
      background: #f0f6ff;
    }

    .msg {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background: white;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
    }

    .pix {
      font-size: 20px;
      font-weight: bold;
      color: green;
      margin: 10px 0;
    }
  </style>
</head>

<body>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Apoie este projeto</h3>
    <p>Se te ajudou, envie um PIX:</p>
    <div class="pix">31 99617-4800</div>
    <button onclick="fechar()">Entrar</button>
  </div>
</div>

<div class="container">

  <div class="topo">
    <h1>PSS 02 2025</h1>
    <p>Nível Superior</p>
  </div>

  <input type="text" id="nome" placeholder="Digite seu nome">

  <button onclick="buscar()">Buscar</button>

  <div id="resultado" class="resultado"></div>

  <div id="msg" class="msg"></div>

</div>

<script>
const arquivo = "resultado_extraido_atualizado.xlsx";
let dados = [];

function fechar(){
  document.getElementById("modal").style.display = "none";
}

function normalizar(texto){
  return (texto || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function getClassificacao(item){
  return item.Classificacao ??
         item["Classificação"] ??
         item["Classificação Geral"] ??
         "";
}

function getCota(item){
  return item.Classificacao_Cota_Negro ??
         item["Classificação Cota Negro"] ??
         "";
}

function buscar(){
  const nome = normalizar(document.getElementById("nome").value);
  const div = document.getElementById("resultado");
  const msg = document.getElementById("msg");

  div.innerHTML = "";
  msg.innerHTML = "";

  if(!nome){
    msg.innerHTML = "Digite um nome.";
    return;
  }

  const resultado = dados.filter(p =>
    normalizar(p.Nome).includes(nome)
  );

  if(resultado.length === 0){
    msg.innerHTML = "Nome não encontrado.";
    return;
  }

  resultado.forEach((p, i) => {
    div.innerHTML += `
      <div class="card destaque">
        <div class="nome">${p.Nome}</div>
        <div class="cargo">${p.Cargo || ""}</div>
        <div class="info">Classificação: ${getClassificacao(p)}</div>
        <div class="info">Cota Negro: ${getCota(p)}</div>
      </div>
    `;
  });
}

fetch(arquivo)
  .then(r => r.arrayBuffer())
  .then(data => {
    const wb = XLSX.read(data, {type: "array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    dados = XLSX.utils.sheet_to_json(ws, {defval: ""});
  });
</script>

</body>
</html>
