<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSS 02 2025</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #dbeafe 0%, #eef2f7 35%, #f8fafc 100%);
      color: #1f2937;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 20px 16px 40px;
    }

    .topo {
      background: linear-gradient(135deg, #1d4ed8, #2563eb, #3b82f6);
      color: white;
      padding: 28px 20px;
      border-radius: 24px;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 18px 40px rgba(37, 99, 235, 0.18);
      position: relative;
      overflow: hidden;
    }

    .topo::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      background: rgba(255,255,255,0.10);
      border-radius: 50%;
      top: -60px;
      right: -40px;
    }

    .topo::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      bottom: -40px;
      left: -30px;
    }

    .topo h1,
    .topo p,
    #tituloCargos {
      position: relative;
      z-index: 1;
    }

    .topo h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0.5px;
    }

    .topo p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.96;
    }

    #tituloCargos {
      font-size: 12px;
      margin-top: 10px;
      opacity: 0.92;
      line-height: 1.6;
    }

    .contador-visitas {
      margin-top: 14px;
      position: relative;
      z-index: 1;
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .contador-visitas span {
      font-size: 16px;
    }

    .card,
    .link-card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 16px;
      border-radius: 20px;
      margin-bottom: 14px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.07);
      border: 1px solid rgba(255,255,255,0.8);
    }

    .link-card {
      border-left: 6px solid #16a34a;
    }

    .link-card h3 {
      margin: 0 0 8px;
      font-size: 17px;
      color: #111827;
    }

    .link-card p {
      margin: 0 0 12px;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }

    .link-pagina {
      display: inline-block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: white;
      font-weight: bold;
      padding: 14px;
      border-radius: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 20px rgba(34, 197, 94, 0.22);
    }

    .link-pagina:hover {
      transform: translateY(-1px);
    }

    .aviso-ir {
      background: linear-gradient(135deg, #fff7ed, #fffbeb);
      border-left: 6px solid #ea580c;
    }

    .aviso-ir h3 {
      color: #9a3412;
    }

    .card {
      padding: 18px;
    }

    input,
    select {
      width: 100%;
      padding: 15px 16px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      font-size: 15px;
      margin-bottom: 12px;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
    }

    input:focus,
    select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14);
      transform: translateY(-1px);
    }

    button {
      width: 100%;
      padding: 15px 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.99);
    }

    .resultado {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .item {
      background: rgba(255,255,255,0.96);
      border-radius: 20px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
      position: relative;
      overflow: hidden;
    }

    .item.destaque {
      border: 1px solid #bfdbfe;
      background: linear-gradient(180deg, #ffffff, #f8fbff);
    }

    .item.destaque::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: linear-gradient(180deg, #2563eb, #60a5fa);
      border-radius: 20px 0 0 20px;
    }

    .nome {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 6px;
      color: #111827;
      padding-left: 8px;
    }

    .cargo {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
      padding-left: 8px;
    }

    .info {
      font-size: 14px;
      margin-bottom: 6px;
      color: #374151;
      padding-left: 8px;
      line-height: 1.5;
    }

    .msg {
      text-align: center;
      color: #6b7280;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .erro {
      color: #b91c1c;
      font-weight: bold;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.70);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }

    .modal {
      background: white;
      padding: 24px 20px;
      border-radius: 22px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      animation: subir 0.25s ease;
    }

    .btn-ir {
      margin-top: 8px;
      background: linear-gradient(135deg, #ea580c, #f97316);
      box-shadow: 0 12px 24px rgba(249, 115, 22, 0.2);
    }
  </style>
</head>

<body>

  <div class="modal-bg" id="modalIR" style="display: none;">
    <div class="modal">
      <h3>⚠️ Prazo do Imposto de Renda MENOR esse ano!</h3>
      <button class="btn-ir" onclick="fecharIR()">Fechar</button>
    </div>
  </div>

  <div class="container">

    <div class="topo">
      <h1>Classificação PSS 02 2025</h1>
      <p>Nível Superior</p>
      <p id="tituloCargos"></p>

      <div class="contador-visitas">
        👁️ Visitas: <span id="contadorVisitas">Carregando...</span>
      </div>
    </div>

    <div class="card">
      <input type="text" id="nome" placeholder="Coloque seu nome aqui" />
      <select id="cargo">
        <option value="">Todos os cargos</option>
      </select>
      <button onclick="buscar()">Pesquisar</button>
      <div id="msg" class="msg"></div>
    </div>

    <div id="resultado" class="resultado"></div>
  </div>

  <script>
    function fecharIR() {
      document.getElementById("modalIR").style.display = "none";
    }
  </script>

</body>
</html>
