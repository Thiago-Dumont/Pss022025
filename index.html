<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSS 02 2025</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eef2f7;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .topo {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      padding: 20px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 16px;
    }

    .topo h1 {
      margin: 0;
      font-size: 24px;
    }

    .topo p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    .card {
      background: white;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 15px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    .resultado {
      display: grid;
      gap: 10px;
    }

    .item {
      background: white;
      border-radius: 16px;
      padding: 14px;
      border: 1px solid #ddd;
    }

    .nome {
      font-weight: bold;
    }

    .cargo {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    .info {
      font-size: 14px;
    }

    .msg {
      text-align: center;
      margin-top: 10px;
      color: #666;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal {
      background: white;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
    }

    .pix {
      font-size: 20px;
      font-weight: bold;
      color: green;
      margin: 10px 0;
    }
  </style>
</head>

<body>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Apoie este projeto</h3>
    <p>Se te ajudou, envie um PIX:</p>
    <div class="pix">31 99617-4800</div>
    <button onclick="fechar()">Entrar</button>
  </div>
</div>

<div class="container">

  <div class="topo">
    <h1>PSS 02 2025 - TODOS OS CARGOS</h1>
    <p>Nível Superior</p>
  </div>

  <div class="card">
    <input type="text" id="nome" placeholder="Coloque seu nome aqui">

    <select id="cargo">
      <option value="">Todos os cargos</option>
    </select>

    <button onclick="buscar()">Pesquisar</button>

    <div id="msg" class="msg"></div>
  </div>

  <div id="resultado" class="resultado"></div>

</div>

<script>
const arquivo = "resultado_extraido_atualizado.xlsx";
let dados = [];

function fechar(){
  document.getElementById("modal").style.display = "none";
}

function abrirModal(){
  document.getElementById("modal").style.display = "flex";
}

function normalizar(texto){
  return (texto || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function getClassificacao(item){
  return item.Classificacao ??
         item["Classificação"] ??
         item["Classificação Geral"] ??
         "";
}

function getCota(item){
  return item.Classificacao_Cota_Negro ??
         item["Classificação Cota Negro"] ??
         "";
}

function preencherCargos(){
  const select = document.getElementById("cargo");
  const cargos = [...new Set(dados.map(d => d.Cargo).filter(Boolean))];

  cargos.sort().forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });
}

function buscar(){

  abrirModal(); // 🔥 MOSTRA PIX NOVAMENTE

  const nome = normalizar(document.getElementById("nome").value);
  const cargo = document.getElementById("cargo").value;

  const div = document.getElementById("resultado");
  const msg = document.getElementById("msg");

  div.innerHTML = "";
  msg.innerHTML = "";

  let resultado = dados;

  if(nome){
    resultado = resultado.filter(p =>
      normalizar(p.Nome).includes(nome)
    );
  }

  if(cargo){
    resultado = resultado.filter(p =>
      p.Cargo === cargo
    );
  }

  if(resultado.length === 0){
    msg.innerHTML = "Nenhum resultado encontrado.";
    return;
  }

  resultado.forEach(p => {
    div.innerHTML += `
      <div class="item">
        <div class="nome">${p.Nome}</div>
        <div class="cargo">${p.Cargo || ""}</div>
        <div class="info">Classificação: ${getClassificacao(p)}</div>
        <div class="info">Cota Negro: ${getCota(p)}</div>
      </div>
    `;
  });
}

fetch(arquivo)
  .then(r => r.arrayBuffer())
  .then(data => {
    const wb = XLSX.read(data, {type: "array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    dados = XLSX.utils.sheet_to_json(ws, {defval: ""});
    preencherCargos();
  });
</script>

</body>
</html>
